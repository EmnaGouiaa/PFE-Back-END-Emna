spring.application.name=PFE-BACK-END-EmnaGouuiaa
#DataSource settings for MySQL database:
spring.datasource.url=jdbc:mysql://localhost:3306/bdPFE?createDatabaseIfNotExist=true&serverTimezone=Africa/Tunis
spring.datasource.username = root
spring.datasource.password =
# Jackson configuration
#Show or not log for each sql query
spring.jpa.show-sql= true
# Hibernate ddl auto (create, update, none)
spring.jpa.hibernate.ddl-auto =update
#Change server port. Default value is 8080
server.port=9999
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.springframework.transaction=TRACE
#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#springdoc.swagger-ui.path=/my-custom-swagger-ui
#springdoc.api-docs.path=/my-api-docs
spring.servlet.multipart.max-file-size=100MB
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
jwt.secret=emna-super-secret-key-2026-secure-jwt-token
jwt.expiration-ms=86400000